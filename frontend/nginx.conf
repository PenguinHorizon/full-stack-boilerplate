# Web container: serves the built app and proxies the API (ADR-003). Every
# host — the platform, {slug}.{platform} and organizations' own domains — lands
# here; TLS is terminated in front of it (deploy/Caddyfile).

# Keep the edge's scheme (https) when there is one; otherwise ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Image uploads go through here. The API enforces MEDIA_MAX_IMAGE_MB (5 MB
    # by default, at most 20); this only has to let them through — nginx's own
    # default (1 MB) would refuse them with 413.
    client_max_body_size 21m;

    # Docker's embedded DNS; resolving at request time (via the variable below)
    # lets this container start even before the `api` service is up.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3003;

    # Security headers for every response. They live at server level only: an
    # `add_header` inside a location would silently drop all of these there,
    # so the locations below use `expires` for caching instead.
    #   geolocation=(self): "use my location" on the branch finder.
    #   frame-src: the optional Google Maps embed on branch pages.
    #   style-src 'unsafe-inline': runtime-injected styles (toasts, Radix).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Same-origin API and uploads: every host serves /api and /uploads itself,
    # so auth cookies stay first-party and no CORS is involved. The API trusts
    # these headers only from private networks (TRUST_PROXY).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 70s;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Per-host SEO files from the API (PUB-08), exactly like the dev proxy.
    location = /sitemap.xml {
        rewrite ^ /api/v1/public/seo/sitemap.xml break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /robots.txt {
        rewrite ^ /api/v1/public/seo/robots.txt break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Client-side routing: unknown paths fall through to the SPA shell, or a
    # hard refresh on /admin/team or /s/northern-trails returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_vary on;
    # Proxied API responses too (a CDN or edge in front sends `Via`).
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;
}
